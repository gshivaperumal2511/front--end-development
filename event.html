<!DOCTYPE html>
<html>
<head>
<title>Event Handling</title>
<script>
function showMsg(){
    alert("Button Clicked!");
}
</script>
</head>
<body>
<h1>Java script Event Handling</h1>
<button onclick="showMsg()">Click Me</button>
<button onclick="showMsg()">Hover Me</button>
</body>
</html>
