<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }
        .box{
            width:300px;
            margin:100px auto;
            padding:20px;
            background:white;
            border:1px solid #ccc;
            text-align:center;
        }
        input{
            width:90%;
            padding:8px;
            margin:8px;
        }
        button{
            padding:8px 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Login</h2>

    <form>
        <input type="text" placeholder="Enter Username" required><br>
        <input type="password" placeholder="Enter Password" required><br>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
